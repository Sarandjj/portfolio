*{box-sizing:border-box;margin:0}
body{font:16px/1.6 Outfit,system-ui,sans-serif;background:#2a1f1a;color:#2a1f1a;min-height:100vh}
a{color:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;color:#f3e6d4}
header b{font-weight:600}header small{color:#c9b49b;margin-left:10px}
header a{font-size:14px;color:#f3e6d4;border:1px solid #6b5444;padding:6px 12px;border-radius:999px;text-decoration:none}
.room{max-width:1100px;margin:0 auto;padding:0 16px}
.scene{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -30px #000}
.scene svg{display:block;width:100%;height:auto}
.hot{cursor:pointer;transition:transform .2s;transform-box:fill-box;transform-origin:center}
.hot:hover,.hot:focus{transform:translateY(-6px)}
.hot:focus{outline:none}
.hot:focus-visible .ring{stroke:#fff;stroke-width:3}
.spark{animation:sp 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.found .spark{display:none}
@keyframes sp{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.steam{animation:st 3s ease-in-out infinite;opacity:.6}
@keyframes st{50%{transform:translateY(-6px);opacity:.2}}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 4px;color:#f3e6d4;font-size:14px;gap:12px;flex-wrap:wrap}
.bar .tip{background:#f3e6d4;color:#2a1f1a;padding:6px 12px;border-radius:8px}
.count{font-weight:600}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:#fbf5ec;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:20;padding:26px 24px;overflow:auto;box-shadow:-20px 0 40px rgba(0,0,0,.3)}
.panel.on{transform:none}
.panel .x{position:absolute;right:16px;top:14px;border:0;background:#eadfcd;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.panel small{font-weight:600;letter-spacing:.1em;color:#b4562e;font-size:12px}
.panel h2{font-size:30px;line-height:1.1;margin:6px 0 10px}
.panel p{color:#5b4a3d;margin-bottom:10px}
.panel ul{padding-left:18px;color:#5b4a3d}
.panel li{margin:6px 0}
.panel .btn{display:inline-block;background:#2a1f1a;color:#fbf5ec;padding:10px 16px;border-radius:999px;text-decoration:none;margin-top:10px;font-weight:500}
.chip{display:inline-block;background:#eadfcd;border-radius:999px;padding:2px 10px;font-size:13px;margin:2px}
.done{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);opacity:0;visibility:hidden;background:#ffd166;color:#2a1f1a;padding:12px 18px;border-radius:14px;font-weight:600;transition:.4s;z-index:30}
.done.on{transform:translate(-50%,0);opacity:1;visibility:visible}
footer{text-align:center;color:#8f7a66;font-size:13px;padding:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<footer>Concept 5 of 7 · The Workshop Desk · prototype</footer>

<script>
const C={
projects:`<small>THE LAPTOP · PROJECTS</small><h2>Seven apps</h2><p>Two client apps live on Google Play and the App Store, and five of my own.</p><ul><li><b>NallHub</b>: one school app, each role sees only what it needs. 447 tests.</li><li><b>Nirai</b>: tasks synced through your own Google Drive. 0 servers.</li><li><b>FinWise</b>: offline money tracker with trip splitting. 300+ tests.</li><li><b>Coin18</b>: a small server guards the API key. 300 KB to 2 KB.</li><li><b>Clean Scanner</b>: documents never leave the phone. 42.5 of 60 MB.</li><li><b>Sports Booking</b> and <b>Weather Monitoring</b>: client apps, live.</li></ul><a class="btn" href="#">See all case studies</a>`,
demos:`<small>THE PHONE · LIVE DEMOS</small><h2>Try the real apps</h2><p>FinWise, Nirai and NallHub run right here in your browser with made-up data. Nothing is sent anywhere.</p><a class="btn" href="#">Launch a demo</a>`,
blog:`<small>THE NOTEBOOK · WRITING</small><h2>Notes from building</h2><ul><li>7 things to have ready before you hire an app developer</li><li>Why you should never put an API key inside a mobile app</li><li>Offline-first sync to Google Drive with no backend</li></ul><a class="btn" href="#">Read the blog</a>`,
about:`<small>THE CHAI · ABOUT</small><h2>Hi, I'm Saran</h2><p>A software developer from Thoothukudi, Tamil Nadu, who enjoys turning ideas into real, usable products. Flutter is my main focus, with React, Node.js and FastAPI for the rest.</p><span class="chip">Neural Schema IT</span><span class="chip">Digisailor</span><span class="chip">B.Sc CS, Sattur</span>`,
cv:`<small>THE CV · RECRUITER VIEW</small><h2>Everything on one page</h2><p><b>Full Stack Developer</b>, Neural Schema IT · Feb 2026 to now<br><b>Mobile App Developer</b>, Digisailor · Nov 2023 to Jan 2026</p><p>Flutter · Dart · React · Next.js · Node.js · TypeScript · FastAPI · PostgreSQL · Supabase · Firebase · AWS</p><a class="btn" href="#">Download CV</a>`,
contact:`<small>THE POSTCARD · CONTACT</small><h2>Got an idea?</h2><p>Tell me what you need. I reply with a short plan and the next steps.</p><a class="btn" href="mailto:sarankumarg.in@gmail.com">sarankumarg.in@gmail.com</a>`};
const found=new Set();
function open(k,el){pc.innerHTML=C[k];panel.classList.add('on');el.classList.add('found');found.add(k);n.textContent=found.size;if(found.size===6)setTimeout(()=>done.classList.add('on'),500)}
document.querySelectorAll('.hot').forEach(el=>{el.onclick=()=>open(el.dataset.k,el);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(el.dataset.k,el)}}});
x.onclick=()=>panel.classList.remove('on');addEventListener('keydown',e=>e.key==='Escape'&&panel.classList.remove('on'));
plain.onclick=e=>{e.preventDefault();open('cv',document.querySelector('[data-k=cv]'))};
</script>
